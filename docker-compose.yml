version: "3.9"

services:
  agenthive:
    build: .
    container_name: agenthive
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ./generated_sites:/app/generated_sites
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
