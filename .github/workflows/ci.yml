name: AgentHive CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Run Ruff linter
        run: ruff check . --output-format=github || true

      - name: Verify core imports
        run: |
          python -c "import agents; print('agents.py OK')"
          python -c "import graph; print('graph.py OK')"
          python -c "import tools; print('tools.py OK')"
          python -c "import server; print('server.py OK')"

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: agenthive:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
